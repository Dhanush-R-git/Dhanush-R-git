name: Update LOC Table in README

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Every Monday

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install cloc
        run: sudo apt install -y cloc

      - name: Generate cloc table
        run: |
          cloc . > loc_output.txt
          echo "### 📊 Code Statistics" > loc_section.md
          echo "\`\`\`" >> loc_section.md
          cat loc_output.txt >> loc_section.md
          echo "\`\`\`" >> loc_section.md

      - name: Update README.md
        run: |
          # Replace the section between <!-- cloc-start --> and <!-- cloc-end -->
          awk '/<!-- cloc-start -->/{print;exit}' README.md > temp.md
          cat loc_section.md >> temp.md
          awk '/<!-- cloc-end -->/{found=1} found' README.md >> temp.md
          mv temp.md README.md

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add README.md
          git commit -m "Update cloc table in README" || echo "No changes"
          git push
