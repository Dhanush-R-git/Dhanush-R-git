name: Update LOC Table in README

# 1️⃣ Grant the Actions runner write access to repo contents
permissions:
  contents: write

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'  # every Monday at 00:00 UTC

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # 2️⃣ Make sure the checkout step uses the token for pushing
          persist-credentials: false

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Generate cloc table
        run: |
          cloc . > loc_output.txt
          {
            echo '```text'
            cat loc_output.txt
            echo '```'
          } > loc_section.md

      - name: Update README.md with new cloc table
        run: |
          awk '/<!-- cloc-start -->/{print; exit}' README.md > tmp.md
          cat loc_section.md >> tmp.md
          awk '/<!-- cloc-end -->/{found=1} found' README.md >> tmp.md
          mv tmp.md README.md

      - name: Commit & push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Auto-update cloc table" || echo "No changes to commit"
          git push

